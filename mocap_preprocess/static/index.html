<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mocap Sync</title>
<link rel="icon" href="/static/assets/minimatex-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hdr-left">
      <div class="sesswitch" id="sesswitch"></div>
      <span class="hdr-div" aria-hidden="true"></span>
      <div id="jobpill"></div>
    </div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="drawer" id="joblog" hidden></div>
  </header>
  <div id="banner"></div>
  <div id="main" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
